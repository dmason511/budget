<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Login</title>
    <link rel="stylesheet" href="/common.css" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-card {
        width: min(460px, 100%);
        background: var(--surface);
        border: 1px solid rgba(217, 226, 236, 0.9);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 20px 42px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(10px);
      }

      .login-title {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 3vw, 2.1rem);
        letter-spacing: -0.03em;
      }

      .login-sub {
        margin: 0 0 18px;
        color: var(--muted);
      }

      .login-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        align-items: center;
      }

      .status-inline {
        margin-top: 10px;
        min-height: 20px;
        color: var(--danger);
      }

      .remember-row {
        margin-top: 12px;
      }

      .remember-option {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.92rem;
        color: var(--text);
      }

      .remember-option input {
        width: auto;
        margin: 0;
      }

      .hint {
        margin-top: 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #f8fbfd;
        color: var(--muted);
        font-size: 0.9rem;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <main class="login-wrap">
      <section class="login-card" aria-label="Login form">
        <h1 class="login-title">Budget</h1>
        <p class="login-sub">Sign in to access transactions, and reports.</p>

        <form id="loginForm">
          <label>
            Username
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
            />
          </label>

          <label>
            Password
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>

          <div class="remember-row">
            <label class="remember-option">
              <input id="rememberMe" name="rememberMe" type="checkbox" />
              Keep me signed in for 14 days
            </label>
          </div>

          <div class="login-actions">
            <button type="submit" id="loginBtn">Sign In</button>
          </div>

          <output id="status" class="status-inline" aria-live="polite"></output>
        </form>

        <div class="hint">
          Sign in with your configured account credentials.
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const status = document.getElementById("status");
      const button = document.getElementById("loginBtn");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const rememberMeInput = document.getElementById("rememberMe");

      const query = new URLSearchParams(window.location.search);
      const nextPathRaw = query.get("next") || "/menu";
      const nextPath = nextPathRaw.startsWith("/") ? nextPathRaw : "/menu";

      usernameInput.focus();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "";
        button.disabled = true;

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              username: usernameInput.value,
              password: passwordInput.value,
              rememberMe: rememberMeInput.checked,
            }),
          });

          if (!response.ok) {
            status.textContent = "Invalid username or password.";
            return;
          }

          window.location.assign(nextPath);
        } catch (error) {
          console.error("Login request failed", error);
          status.textContent = "Unable to sign in. Please try again.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
